name: xiaojiang-worker

# 中心仓库的 worker：服务器上的轮询器把「有人在某个仓库 @ 小酱」写成一条 JSON 评论，
# 投到本仓库的任务队列 issue（#1）。这个 workflow 读出来，去目标仓库 fork、干活、回帖。
#
# 需要三个 secret：
#   DSH_API_KEY        模型网关的 key（sk- 开头）
#   XIAOJIANG_PAT      小酱账号的 classic PAT（repo scope）
#   XIAOJIANG_APP_KEY  XiaoJiang-CodeAgent 的私钥（回帖显示成 bot）
#
# 谁能召唤：仓库变量 COWORKER_ALLOW（逗号分隔的 GitHub 账号），默认只有主人和
# 小酱自己。轮询器里另有一份 allow.txt，两边都要放行才会执行。
#
# 任务载荷（轮询器写进 #1 的评论正文，json 代码块）：
#   {"target":"owner/repo","number":123,"comment_id":456,"commenter":"login",
#    "author_association":"OWNER","body":"评论原文","created_at":"..."}
#
# 目标仓库始终保持只读：小酱只在它自己的 fork 上改东西，结论回帖到原仓库的 issue/PR。

on:
  issue_comment:
    types: [created]

# 只回帖要写权限；仓库内容一个字都不改，所以 contents 只要能读。
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: xj-worker
  cancel-in-progress: false

env:
  DSH_MODEL: ${{ vars.DSH_MODEL || 'group/never-stuck' }}
  # 记忆放在小酱名下的 private 仓库里，不跟着 public 的 fork 一起公开。
  MEM_REPO: ${{ vars.COOWER_MEM_REPO || 'XiaoJiang-code/xiaojiang-memory' }}
  KEY_PROXY_UPSTREAM: ${{ vars.DSH_BASE_URL || 'https://logic769.xyz/v1' }}

jobs:
  work:
    # 三种召唤方式：/小酱 前缀、@XiaoJiang-code、@小酱。
    # 排除小酱自己和 github-actions[bot]，否则回帖里带「小酱」就会自我触发成死循环。
    # 只认任务队列 issue 上、由小酱自己的 App 写进来的载荷评论。
    if: |
      github.event.issue.number == 1 &&
      github.event.comment.user.login == 'xiaojiang-codeagent[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # gh 命令要从 git remote 推断仓库，先把调用方仓库签出来（只为给 gh 一个上下文）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 队列评论 = 一张任务单。拆成后续步骤要用的字段，整份 JSON 也落盘备用。
      - name: Parse payload
        id: p
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 队列评论在本仓库（中心仓库）的 issue #1 里，不是目标仓库。
          QUEUE_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COWORKER_ALLOW: ${{ vars.COWORKER_ALLOW || 'Logic769,XiaoJiang-code' }}
        run: |
          mkdir -p .ci
          BODY=$(gh api "repos/$QUEUE_REPO/issues/comments/$COMMENT_ID" --jq .body)
          printf '%s\n' "$BODY" > .ci/queue-comment.md
          sed -n '/^```json$/,/^```$/p' .ci/queue-comment.md | sed '1d;$d' > .ci/payload.json
          if [ ! -s .ci/payload.json ]; then
            echo '::error::队列评论里没有 json 代码块，忽略'
            exit 1
          fi
          TARGET=$(jq -r '.target // empty' .ci/payload.json)
          NUMBER=$(jq -r '.number // empty' .ci/payload.json)
          ASSOC=$(jq -r '.author_association // "NONE"' .ci/payload.json)
          COMMENT=$(jq -r '.commenter // empty' .ci/payload.json)
          if [ -z "$TARGET" ] || [ -z "$NUMBER" ]; then
            echo '::error::载荷缺 target 或 number'
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "assoc=$ASSOC" >> "$GITHUB_OUTPUT"
          # 召唤白名单：逗号分隔，来自仓库变量 COWORKER_ALLOW（默认只有小酱的主人和小酱自己）。
          ALLOW=$(printf '%s' "$COWORKER_ALLOW" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          who=$(printf '%s' "$COMMENT" | tr '[:upper:]' '[:lower:]')
          case ",$ALLOW," in
            *",$who,"*) echo "allow=ok who=$COMMENT assoc=$ASSOC" ;;
            *) echo "::error::$COMMENT 不在召唤白名单（COWORKER_ALLOW=$COWORKER_ALLOW），已拒绝"; exit 1 ;;
          esac
          echo "parsed target=$TARGET number=$NUMBER assoc=$ASSOC"

      - name: Fork or reuse
        id: fork
        env:
          BOT_PAT: ${{ secrets.XIAOJIANG_PAT }}
          SRC: ${{ steps.p.outputs.target }}
        run: |
          if [ -z "$BOT_PAT" ]; then
            echo "::error::缺 secret XIAOJIANG_PAT（小酱账号的 classic PAT，scope 至少 repo）"
            exit 1
          fi
          export GH_TOKEN="$BOT_PAT"
          BOT=$(gh api user --jq .login)
          NAME=${SRC#*/}
          echo "bot=$BOT src=$SRC name=$NAME"
          # 目标仓库本来就在小酱名下：不 fork 自己，直接用它。
          SRC_OWNER=${SRC%%/*}
          if [ "$(printf '%s' "$SRC_OWNER" | tr 'A-Z' 'a-z')" = "$(printf '%s' "$BOT" | tr 'A-Z' 'a-z')" ]; then
            echo "bot_repo=$SRC" >> "$GITHUB_OUTPUT"
            gh repo clone "$SRC" fork -- --depth 50
            cd fork
            git config user.name "xiaojiang"
            git config user.email "{{EMAIL_9am2kw4p}}"
            echo "cloned=$SRC self=1 head=$(git rev-parse --short HEAD)"
            exit 0
          fi
          # 已经 fork 过就直接复用；fork 是异步的，新建要多等几秒。
          FLAG=$(gh api "repos/$BOT/$NAME" --jq ".fork" 2>/dev/null || echo none)
          echo "fork_before=$FLAG"
          if [ "$FLAG" != "true" ]; then
            gh api -X POST "repos/$SRC/forks" --jq ".full_name" || true
            for i in $(seq 1 20); do
              FLAG=$(gh api "repos/$BOT/$NAME" --jq ".fork" 2>/dev/null || echo none)
              if [ "$FLAG" = "true" ]; then break; fi
              sleep 3
            done
          fi
          if [ "$FLAG" != "true" ]; then
            echo "::error::fork 失败：$BOT/$NAME 不可用（私有仓库？同名仓库？PAT 权限不足？）"
            exit 1
          fi
          echo "bot_repo=$BOT/$NAME" >> "$GITHUB_OUTPUT"
          gh repo clone "$BOT/$NAME" fork -- --depth 50
          cd fork
          git config user.name "xiaojiang"
          git config user.email "{{EMAIL_9am2kw4p}}"
          echo "cloned=$BOT/$NAME head=$(git rev-parse --short HEAD)"

      - name: Prepare memory repo
        env:
          GH_TOKEN: ${{ secrets.XIAOJIANG_PAT }}
        run: |
          if ! gh repo view "$MEM_REPO" > /dev/null 2>&1; then
            echo "memory_repo_missing - 正在建 $MEM_REPO"
            gh repo create "$MEM_REPO" --private --description '小酱的跨对话记忆（交接 + 会话包）' 2>&1 | tail -3 || true
            for i in $(seq 1 10); do
              if gh repo view "$MEM_REPO" > /dev/null 2>&1; then break; fi
              sleep 3
            done
          fi
          if gh repo view "$MEM_REPO" --json isEmpty --jq '.isEmpty' 2>/dev/null | grep -q true; then
            mkdir -p memory-repo
            cd memory-repo
            git init -b main > /dev/null
            gh auth setup-git
            git remote add origin "https://github.com/$MEM_REPO.git"
            git config user.name "xiaojiang"
            git config user.email "{{EMAIL_9am2kw4p}}"
            printf '# 小酱的记忆\n' > README.md
            git add README.md
            git commit -m 'init' > /dev/null
            git push -u origin main
            echo "memory_repo=created"
          else
            gh repo clone "$MEM_REPO" memory-repo -- --depth 50
            cd memory-repo
            git config user.name "xiaojiang"
            git config user.email "{{EMAIL_9am2kw4p}}"
            echo "memory_repo=reused"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dsh
        run: |
          npm i -g pnpm
          npm i -g @deepseek-ai/dsh@0.2.1-rc.5

      - name: Install coworker profile
        run: |
          dsh plugin --profile coworker add billion-context dsh-read-url dsh-free-search dsh-mnemon
          node -e '
            const fs=require("fs"), os=require("os"), p=require("path");
            const f=p.join(os.homedir(),".dsh/profiles/coworker/package.json");
            const j=JSON.parse(fs.readFileSync(f,"utf8"));
            const b=j.dsh.profile.bundles;
            if(!b.includes("@deepseek-ai/dsh-headless")) b.splice(1,0,"@deepseek-ai/dsh-headless");
            fs.writeFileSync(f,JSON.stringify(j,null,2));
          '
          dsh --profile coworker --dump-config > /dev/null

      - name: Restore session
        id: sess
        env:
          GH_TOKEN: ${{ secrets.XIAOJIANG_PAT }}
          TARGET: ${{ steps.p.outputs.target }}
        run: |
          mkdir -p "$HOME/.dsh/sessions"
          cd memory-repo
          gh auth setup-git
          SLUG=$(printf '%s' "$TARGET" | tr '/' '-')
          if git fetch --no-tags --depth 1 origin "session-$SLUG" 2>/dev/null; then
            if git show FETCH_HEAD:sessions.tar.zst > /tmp/sessions.tar.zst 2>/dev/null; then
              echo "session_pack_bytes=$(wc -c < /tmp/sessions.tar.zst)"
              if tar --zstd -xf /tmp/sessions.tar.zst -C "$HOME"; then echo "session_restored=yes"; fi
            else
              echo "session_restored=none - 记忆仓库里还没有这个仓库的会话包"
            fi
          else
            echo "session_restored=none - session-$SLUG 分支还不存在"
          fi

      - name: Build task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.p.outputs.number }}
          TARGET: ${{ steps.p.outputs.target }}
        run: |
          mkdir -p .ci
          SLUG=$(printf '%s' "$TARGET" | tr '/' '-')
          MEM_DIR="memory-repo/memory/$SLUG"
          mkdir -p "$MEM_DIR/issues"
          IS_PR=0
          if gh pr view "$NUMBER" --repo "$TARGET" --json number > /dev/null 2>&1; then IS_PR=1; fi
          THREAD=".ci/thread.md"
          if [ "$IS_PR" = "1" ]; then
            gh pr view "$NUMBER" --repo "$TARGET" --json title,body,headRefName,baseRefName,isCrossRepository,comments > .ci/pr.json
            {
              printf '# PR #%s %s\n\n%s\n\n---\n\n' "$NUMBER" "$(jq -r .title .ci/pr.json)" "$(jq -r '.body // ""' .ci/pr.json)"
              jq -r '(.comments // []) | map("### " + .author.login + "\n\n" + .body) | join("\n\n")' .ci/pr.json
            } > "$THREAD"
            gh pr diff "$NUMBER" --repo "$TARGET" > .ci/pr.diff 2>/dev/null && echo "pr_diff_bytes=$(wc -c < .ci/pr.diff)"
          else
            gh issue view "$NUMBER" --repo "$TARGET" --comments > "$THREAD"
          fi
          echo "thread_file=$THREAD bytes=$(wc -c < "$THREAD")"
          # 会话能续接时前面的历史已经在会话里，不必再塞 60 KB 交接。
          RESUMING=0
          SID_FILE="$MEM_DIR/issues/.session-$NUMBER"
          if [ -f "$SID_FILE" ]; then
            OLD="$(cat "$SID_FILE")"
            if [ -n "$OLD" ] && find "$HOME/.dsh/sessions" -maxdepth 3 -type d \( -name "$OLD" -o -name "session-$OLD" \) 2>/dev/null | head -1 | grep -q .; then
              RESUMING=1
            fi
          fi
          echo "resuming=$RESUMING"
          {
            if [ -f .xiaojiang/persona.md ]; then
              cat .xiaojiang/persona.md
              echo
              echo "---"
              echo
            else
              echo "::warning::.xiaojiang/persona.md 缺失"
            fi
            echo "## 本轮的工作方式：fork 模式（覆盖上面的环境说明）"
            echo
            echo "你在小酱账号名下的 fork 里，目录是 $GITHUB_WORKSPACE/fork。"
            echo "这一份是从 ${{ steps.p.outputs.target }} fork 出来的，代码内容和原仓一样。"
            echo "原仓库对你只读：你改不进去，也不需要改进去。"
            echo
            echo "**记忆和会话都存在这个 fork 里**（memory/ 目录 + coworker-session 分支），"
            echo "下一轮还在这个 issue 里叫你会接着上一次的会话。"
            echo
            if [ "$IS_PR" = "1" ]; then
              echo "调度入口：$TARGET 的 PR #$NUMBER"
            else
              echo "调度入口：$TARGET 的 issue #$NUMBER"
            fi
            echo
            if [ -f "$MEM_DIR/HANDOFF.md" ]; then
              if [ "$RESUMING" = "1" ]; then
                echo "## 交接文档"
                echo
                echo "这一轮续接的是同一个会话，前面的事都在你的上下文里。"
                echo "完整交接在 $MEM_DIR/HANDOFF.md，需要核对细节时自己读。"
                echo
              else
                echo "## 本仓库的交接（上一轮留下的，由 billion-context 导出）"
                echo
                cat "$MEM_DIR/HANDOFF.md"
                echo
              fi
            fi
            echo "## 讨论上下文（按需自取，不必整段引用）"
            echo
            echo "全文在：$GITHUB_WORKSPACE/$THREAD"
            if [ "$IS_PR" = "1" ] && [ -s .ci/pr.diff ]; then
              echo "这个 PR 的改动 diff 在：$GITHUB_WORKSPACE/.ci/pr.diff"
            fi
            echo
            echo "## 本次指令（触发这一轮的评论）"
            echo
            jq -r '.body // ""' .ci/payload.json
            echo
            echo "## 本次任务要求"
            echo "1. 你的改动只会留在 fork 里，不会进原仓库 —— 要让人看见结论，就写进最终回复。"
            echo "2. 交接文档不用手写，也绝对不要写进回复；完整会话会自动导出到小酱自己的记忆仓库。"
            echo "3. 回复里不要出现密钥、令牌或任何凭据。"
            echo "4. 直接给结论和下一步，不要复述过程。"
          } > .ci/task.txt
          echo "task_bytes=$(wc -c < .ci/task.txt)"

      - name: Start key proxy
        env:
          REAL_KEY: ${{ secrets.DSH_API_KEY }}
        run: |
          printf '%s' "$REAL_KEY" | nohup node .xiaojiang/key-proxy.mjs > .ci/proxy.log 2>&1 &
          PROXY_PID=$!
          echo "$PROXY_PID" > .ci/proxy.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/healthz > .ci/healthz.json 2>/dev/null; then
              echo "proxy_ready=$(cat .ci/healthz.json)"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::key-proxy 没起来"
          cat .ci/proxy.log || true
          exit 1

      - name: Ask
        env:
          DSH_API_KEY: sk-local-proxy-not-a-real-key
          ISSUE: ${{ steps.p.outputs.number }}
          TARGET: ${{ steps.p.outputs.target }}
        run: |
          export DEEPSEEK_API_KEY="$DSH_API_KEY"
          export DSH_API_KEY="$DSH_API_KEY"
          export DEEPSEEK_BASE_URL="http://127.0.0.1:8787/v1"
          printf -- '- id: agent-default-model\n  config:\n    provider: deepseek-official\n    model: %s\n' "$DSH_MODEL" > .ci/model.patch.yml
          SLUG=$(printf '%s' "$TARGET" | tr '/' '-')
          SID_FILE="memory-repo/memory/$SLUG/issues/.session-$ISSUE"
          ARGS=()
          if [ -f "$SID_FILE" ]; then
            OLD_SID="$(cat "$SID_FILE")"
            FOUND=$(find "$HOME/.dsh/sessions" -maxdepth 3 -type d \( -name "$OLD_SID" -o -name "session-$OLD_SID" \) 2>/dev/null | head -1)
            if [ -n "$OLD_SID" ] && [ -n "$FOUND" ]; then
              ARGS+=(--session-id "$OLD_SID")
              echo "resume_session=$OLD_SID"
            else
              echo "resume_session=miss(${OLD_SID:-none})"
            fi
          else
            echo "resume_session=none - 这个 thread 还没有过会话"
          fi
          set +e
          # 以 fork 为工作目录跑：能读代码，也能就地写记忆。
          run_dsh() {
            ( cd fork && cat "$GITHUB_WORKSPACE/.ci/task.txt" | dsh --profile coworker --patch "$GITHUB_WORKSPACE/.ci/model.patch.yml" --json "$@" ) > .ci/run.jsonl 2> .ci/run.err
          }
          run_dsh "${ARGS[@]}"
          code=$?
          # 会话记录是绑定工作目录的：换了仓库/目录就会 mismatch。丢弃旧会话重跑一次。
          if [ "$code" -ne 0 ] && [ ${#ARGS[@]} -gt 0 ] && grep -q "was recorded in" .ci/run.err; then
            echo "session_cwd_mismatch=1 - 旧会话录在别的目录，丢弃后重跑"
            : > "$SID_FILE"
            run_dsh
            code=$?
          fi
          set -e
          echo "$code" > .ci/exit
          echo "dsh_exit=$code"
          jq -R -r 'fromjson? | select(.type=="final") | .text' .ci/run.jsonl > .ci/reply.md || true
          echo "reply_bytes=$(wc -c < .ci/reply.md)"
          if [ "$code" -ne 0 ]; then
            echo "::warning::dsh exited $code"
            tail -c 4000 .ci/run.err
          fi

      - name: Stop key proxy
        if: always()
        run: |
          echo "proxy_stats=$(curl -fsS http://127.0.0.1:8787/healthz 2>/dev/null || echo '{}')"
          if [ -f .ci/proxy.pid ]; then kill "$(cat .ci/proxy.pid)" 2>/dev/null || true; fi
          pkill -f 'key-proxy[.]mjs' 2>/dev/null || true
          echo "proxy_stopped"

      - name: Export handoff
        env:
          TARGET: ${{ steps.p.outputs.target }}
        run: |
          SLUG=$(printf '%s' "$TARGET" | tr '/' '-')
          MEM="memory-repo/memory/$SLUG/HANDOFF.md"
          mkdir -p "$(dirname "$MEM")"
          SID=$(jq -R -r 'fromjson? | select(.type=="session") | .sessionId' .ci/run.jsonl | head -1)
          echo "session_id=${SID:-none}"
          BILI="$HOME/.dsh/profiles/coworker/node_modules/billion-context/dist/index.js"
          if [ -z "$SID" ] || [ ! -f "$BILI" ]; then
            echo "::warning::拿不到 session id 或 billion-context 没装，交接改走回复兜底"
          else
            if node "$BILI" export "$SID" --output "$MEM" > .ci/bili.log 2>&1 && [ -s "$MEM" ] && [ "$(wc -c < "$MEM")" -ge 500 ]; then
              echo "handoff_source=bili-summary bytes=$(wc -c < "$MEM")"
            elif node "$BILI" export "$SID" --full --output "$MEM" > .ci/bili.log 2>&1 && [ -s "$MEM" ]; then
              head -c 120000 "$MEM" > "$MEM.cut" && mv "$MEM.cut" "$MEM"
              echo "handoff_source=bili-full bytes=$(wc -c < "$MEM")"
            else
              echo "::warning::bili export 失败"
              tail -20 .ci/bili.log || echo "(no log)"
            fi
          fi
          if [ -f "$MEM" ] && [ "$(wc -c < "$MEM")" -gt 60000 ]; then
            { head -c 2000 "$MEM"; printf '\n\n…（中间省略：导出超 60 KB，只留头尾）…\n\n'; tail -c 58000 "$MEM"; } > "$MEM.cut"
            mv "$MEM.cut" "$MEM"
            echo "handoff_truncated bytes=$(wc -c < "$MEM")"
          fi
          if [ ! -s "$MEM" ]; then
            {
              echo "# 交接 · issue #${{ steps.p.outputs.number }} · $(date -u +%F)"
              echo
              cat .ci/reply.md 2>/dev/null || echo "(无回复)"
            } > "$MEM"
            echo "handoff_source=reply-fallback bytes=$(wc -c < "$MEM")"
          fi
          if [ -n "$SID" ]; then
            mkdir -p "$(dirname "$MEM")"/issues
            printf "%s\n" "$SID" > "$(dirname "$MEM")/issues/.session-${{ steps.p.outputs.number }}"
            echo "session_saved=$SID"
          fi

      - name: Persist memory
        env:
          ISSUE: ${{ steps.p.outputs.number }}
          GH_TOKEN: ${{ secrets.XIAOJIANG_PAT }}
        run: |
          cd memory-repo
          gh auth setup-git
          git add memory || true
          if git diff --cached --quiet; then echo "memory unchanged"; exit 0; fi
          git commit -m "memory: handoff from #$ISSUE"
          git push origin HEAD || echo "::warning::memory push rejected - 下一轮看不到这次交接"
          echo "memory_pushed=$(git rev-parse --short HEAD)"

      - name: Redact
        if: always()
        env:
          SECRET_A: ${{ secrets.DSH_API_KEY }}
          SECRET_B: ${{ secrets.XIAOJIANG_PAT }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = '.ci/reply.md';
          if (!fs.existsSync(p)) { console.log('redact=skip'); process.exit(0); }
          let s = fs.readFileSync(p, 'utf8');
          const known = [process.env.SECRET_A, process.env.SECRET_B].filter(v => typeof v === 'string' && v.length >= 8);
          let hits = 0;
          for (const v of known) {
            const re = new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
            const before = s;
            s = s.replace(re, '***REDACTED***');
            if (s !== before) hits++;
          }
          const shapes = [
            /github_pat_[A-Za-z0-9_]{20,}/g,
            /gh[pousr]_[A-Za-z0-9]{30,}/g,
            /sk-[A-Za-z0-9_-]{20,}/g,
            /-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----/g,
          ];
          for (const re of shapes) {
            const before = s;
            s = s.replace(re, '***REDACTED***');
            if (s !== before) hits++;
          }
          if (hits > 0) s = '> ⚠️ 本条回复里有 ' + hits + ' 处疑似密钥，已经打码。\n\n' + s;
          fs.writeFileSync(p, s);
          console.log('redact_hits=' + hits);
          NODE

      - name: Mint app token
        id: app
        env:
          APP_ID: '5597152'
          INSTALL_ID: '178235263'
          APP_KEY: ${{ secrets.XIAOJIANG_APP_KEY }}
        run: |
          # 用 App 私钥签 JWT，换 installation token：回帖作者会显示成
          # xiaojiang-codeagent[bot]，而不是 XiaoJiang-code 这个用户账号。
          if [ -z "$APP_KEY" ]; then echo "app_token=skip(没有 XIAOJIANG_APP_KEY)"; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          PAYLOAD=$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((NOW-60))" "$((NOW+540))" "$APP_ID" | b64)
          printf '%s' "$APP_KEY" > /tmp/app.pem
          SIG=$(printf '%s' "$HEADER.$PAYLOAD" | openssl dgst -sha256 -sign /tmp/app.pem | b64)
          rm -f /tmp/app.pem
          JWT="$HEADER.$PAYLOAD.$SIG"
          TOKEN=$(curl -fsS -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$INSTALL_ID/access_tokens" 2>/dev/null | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::warning::拿不到 App installation token，回帖退回 PAT"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "app_token=ok len=${#TOKEN}"

      - name: Reply
        if: always()
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PAT: ${{ secrets.XIAOJIANG_PAT }}
          NUMBER: ${{ steps.p.outputs.number }}
          TARGET: ${{ steps.p.outputs.target }}
        run: |
          if [ -s .ci/reply.md ] && [ -n "$(tr -d "[:space:]" < .ci/reply.md)" ]; then
            head -c 60000 .ci/reply.md > .ci/body.md
          else
            {
              echo "任务没有产生回复。dsh 退出码：$(cat .ci/exit 2>/dev/null || echo unknown)"
              echo
              echo '```'
              tail -c 3000 .ci/run.err 2>/dev/null || echo "(stderr 为空)"
              echo '```'
            } > .ci/body.md
          fi
          export GH_TOKEN="$PAT"
          KIND=issue
          if gh pr view "$NUMBER" --repo "$TARGET" --json number > /dev/null 2>&1; then KIND=pr; fi
          post() {
            if [ "$KIND" = "pr" ]; then
              gh pr comment "$NUMBER" --repo "$TARGET" --body-file .ci/body.md
            else
              gh issue comment "$NUMBER" --repo "$TARGET" --body-file .ci/body.md
            fi
          }
          # 优先 App token（显示成 bot）；App 没装到目标仓库时它没权限，退回 PAT。
          if [ -n "$APP_TOKEN" ]; then
            export GH_TOKEN="$APP_TOKEN"
            if post 2> .ci/post.err; then echo "reply_as=app[bot]"; exit 0; fi
            echo "::warning::App token 回帖失败（目标仓库没装这个 App？），退回 PAT：$(tail -c 300 .ci/post.err 2>/dev/null | tr "\n" " ")"
            export GH_TOKEN="$PAT"
          fi
          post
          echo "reply_as=pat"

      - name: Save session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.XIAOJIANG_PAT }}
          TARGET: ${{ steps.p.outputs.target }}
        run: |
          SESS="$HOME/.dsh/sessions"
          if [ ! -d "$SESS" ]; then echo "session_save=skip(no sessions dir)"; exit 0; fi
          if ! tar --zstd -cf /tmp/sessions.tar.zst -C "$HOME" .dsh/sessions 2>/dev/null; then
            echo "::warning::会话打包失败，跳过保存"; exit 0
          fi
          SIZE=$(wc -c < /tmp/sessions.tar.zst)
          echo "session_pack_bytes=$SIZE"
          if [ "$SIZE" -gt 52428800 ]; then echo "::warning::会话包 $SIZE 字节超过 50 MB，跳过保存"; exit 0; fi
          cd memory-repo
          gh auth setup-git
          SLUG=$(printf '%s' "$TARGET" | tr '/' '-')
          BLOB=$(git hash-object -w /tmp/sessions.tar.zst)
          TREE=$(printf '100644 blob %s\tsessions.tar.zst\n' "$BLOB" | git mktree)
          COMMIT=$(git -c user.name=xiaojiang -c user.email={{EMAIL_9am2kw4p}} commit-tree "$TREE" -m "session: issue #${{ steps.p.outputs.number }} run ${{ github.run_id }}")
          git push -f origin "$COMMIT:refs/heads/session-$SLUG" 2>&1 | tail -2
          echo "session_pushed=$COMMIT"